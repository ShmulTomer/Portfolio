version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Amplify's image still defaults to Node 16, which Vite 5 cannot run on.
        - nvm install 20
        - nvm use 20
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
